background:white;

SUBMIT ATTENDANCE

<script>
/* GitHub/Netlify front end: uses fetch() to call Apps Script backend. */

let imageData = "";
let isSubmitting = false;
let cachedPosition = null;
let cachedPositionTime = 0;

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwb0v-JmhZ5vaE0Alg8lkI0eayYTsRN2Sc6x6h8JbBFVkSii79VK8BjD-59eCbewFQ5Xg/exec";

// ======================================================
// LOAD EMPLOYEES FROM GOOGLE SHEET
// ======================================================

window.addEventListener("load", loadEmployees);

function loadEmployees(){

    const employeeSelect =
        document.getElementById("name");

    const cacheKey =
        "pointOneEmployees";

    /*
     * Show the last saved employee list immediately.
     * This removes the visible waiting time on repeat visits.
     */
    let cachedNames = [];

    try{

        cachedNames = JSON.parse(
            localStorage.getItem(cacheKey) || "[]"
        );

    }catch(error){

        cachedNames = [];
    }

    if(
        Array.isArray(cachedNames) &&
        cachedNames.length > 0
    ){

        renderEmployeeOptions(
            cachedNames
        );

    }else{

        employeeSelect.disabled = true;

        employeeSelect.innerHTML =
            '<option value="">Loading Employees...</option>';
    }

    /*
     * Refresh silently from Apps Script.
     */
    const formData =
        new URLSearchParams();

    formData.append(
        "action",
        "getEmployees"
    );

    fetch(SCRIPT_URL, {
        method:"POST",
        body:formData,
        redirect:"follow"
    })
    .then(function(response){

        if(!response.ok){

            throw new Error(
                "Server error " +
                response.status
            );
        }

        return response.text();
    })
    .then(function(text){

        let names;

        try{

            names = JSON.parse(text);

        }catch(error){

            throw new Error(
                "Invalid employee-list response."
            );
        }

        if(!Array.isArray(names)){

            throw new Error(
                "Employee list is unavailable."
            );
        }

        names = names
            .map(function(name){

                return String(
                    name || ""
                ).trim();

            })
            .filter(function(name){

                return name !== "";
            });

        names = Array.from(
            new Set(names)
        ).sort(function(a, b){

            return a.localeCompare(b);
        });

        localStorage.setItem(
            cacheKey,
            JSON.stringify(names)
        );

        renderEmployeeOptions(
            names
        );

    })
    .catch(function(error){

        /*
         * Keep cached names available when the
         * server is temporarily slow or offline.
         */
        if(
            !Array.isArray(cachedNames) ||
            cachedNames.length === 0
        ){

            employeeSelect.innerHTML =
                '<option value="">UNABLE TO LOAD EMPLOYEES</option>';

            employeeSelect.disabled = true;

            showStatus(
                "❌ Unable to load employees. " +
                error.message,
                "#E53935",
                6000
            );
        }
    });
}


function renderEmployeeOptions(names){

    const employeeSelect =
        document.getElementById("name");

    employeeSelect.innerHTML =
        '<option value="">SELECT EMPLOYEE</option>';

    names.forEach(function(name){

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        employeeSelect.appendChild(
            option
        );
    });

    employeeSelect.disabled =
        names.length === 0;

    if(names.length === 0){

        employeeSelect.innerHTML =
            '<option value="">NO EMPLOYEES FOUND</option>';
    }
}


let currentEmployeeStatus = null;

document.getElementById("name").addEventListener(
    "change",
    function(){

        const name = this.value;

        resetAttendanceUI();

        if(!name){
            return;
        }

        checkEmployeeStatus(name);
    }
);

function resetAttendanceUI(){

    currentEmployeeStatus = null;

    const attendanceSelect =
        document.getElementById("attendance");

    attendanceSelect.innerHTML =
        '<option value="">SELECT EMPLOYEE FIRST</option>';

    attendanceSelect.disabled = true;

    document.getElementById(
        "statusLoading"
    ).style.display = "none";

    document.getElementById(
        "selfieContainer"
    ).style.display = "block";

    document.getElementById(
        "selfieInfo"
    ).style.display = "none";

    removeSelfie();
}

function checkEmployeeStatus(name){

    const statusLoading =
        document.getElementById("statusLoading");

    const attendanceSelect =
        document.getElementById("attendance");

    statusLoading.style.display = "block";

    attendanceSelect.disabled = true;

    const formData =
        new URLSearchParams();

    formData.append("action", "getStatus");
    formData.append("action", "saveAttendance");
            formData.append("name", name);

    fetch(SCRIPT_URL, {
        method:"POST",
        body:formData,
        redirect:"follow"
    })
    .then(function(response){

        if(!response.ok){
            throw new Error(
                "Server error " + response.status
            );
        }

        return response.text();
    })
    .then(function(text){

        let data;

        try{
            data = JSON.parse(text);
        }catch(error){
            throw new Error(
                "Invalid status response."
            );
        }

        statusLoading.style.display = "none";

        if(!data.success){

            showStatus(
                "❌ " + (
                    data.message ||
                    "Unable to check attendance status."
                ),
                "#E53935",
                5000
            );

            return;
        }

        currentEmployeeStatus = data;

        updateAttendanceOptions(data);

    })
    .catch(function(error){

        statusLoading.style.display = "none";

        showStatus(
            "❌ Unable to check employee status. " +
            error.message,
            "#E53935",
            6000
        );
    });
}

function applySuccessfulAction(action){

    if(!currentEmployeeStatus){
        return;
    }

    const now = new Date().toLocaleTimeString("en-US");

    if(action === "TIME IN"){
        currentEmployeeStatus.timeIn = true;
        currentEmployeeStatus.timeInTime = now;
        currentEmployeeStatus.nextActions = [
            "LUNCH OUT",
            "TIME OUT"
        ];
    }

    if(action === "LUNCH OUT"){
        currentEmployeeStatus.lunchOut = true;
        currentEmployeeStatus.lunchOutTime = now;
        currentEmployeeStatus.nextActions = [
            "LUNCH IN",
            "TIME OUT"
        ];
    }

    if(action === "LUNCH IN"){
        currentEmployeeStatus.lunchIn = true;
        currentEmployeeStatus.lunchInTime = now;
        currentEmployeeStatus.nextActions = [
            "TIME OUT"
        ];
    }

    if(action === "TIME OUT"){
        currentEmployeeStatus.timeOut = true;
        currentEmployeeStatus.timeOutTime = now;
        currentEmployeeStatus.completed = true;
        currentEmployeeStatus.nextActions = [];
    }

    updateAttendanceOptions(
        currentEmployeeStatus
    );
}

function updateAttendanceOptions(data){

    const attendanceSelect =
        document.getElementById("attendance");

    attendanceSelect.innerHTML = "";

    if(data.completed){

        attendanceSelect.innerHTML =
            '<option value="">ATTENDANCE COMPLETED</option>';

        attendanceSelect.disabled = true;

        document.getElementById(
            "selfieContainer"
        ).style.display = "none";

        document.getElementById(
            "selfieInfo"
        ).style.display = "none";

        showStatus(
            "✅ Attendance completed today.",
            "#28A745",
            5000
        );

        return;
    }

    const placeholder =
        document.createElement("option");

    placeholder.value = "";
    placeholder.textContent =
        "SELECT ATTENDANCE";

    attendanceSelect.appendChild(
        placeholder
    );

    const labels = {
        "TIME IN":"🟢 TIME IN",
        "LUNCH OUT":"🍽️ LUNCH OUT",
        "LUNCH IN":"🍴 LUNCH IN",
        "TIME OUT":"🔴 TIME OUT"
    };

    data.nextActions.forEach(
        function(action){

            const option =
                document.createElement("option");

            option.value = action;
            option.textContent =
                labels[action] || action;

            attendanceSelect.appendChild(
                option
            );
        }
    );

    attendanceSelect.disabled = false;
}

document.getElementById("attendance").addEventListener("change", function(){

    const selfieContainer =
        document.getElementById("selfieContainer");

    const selfieInfo =
        document.getElementById("selfieInfo");

    document.getElementById("status").innerHTML = "";

    if(this.value === "LUNCH IN" || this.value === "LUNCH OUT"){

        selfieContainer.style.display = "none";
        selfieInfo.style.display = "block";
        removeSelfie();

    }else{

        selfieContainer.style.display = "block";
        selfieInfo.style.display = "none";

    }

});

function loadSelfie(event){

    const file = event.target.files[0];
    const status = document.getElementById("status");

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        status.style.color = "#E53935";
        status.innerHTML = "❌ Please select a valid image.";
        event.target.value = "";
        return;
    }

    status.style.color = "#444";
    status.innerHTML = "⏳ Preparing selfie...";

    /*
     * Smaller image = faster upload to Apps Script and Google Drive.
     * Natural orientation is preserved; no mirror/flip is applied.
     */
    const maxSize = 360;
    const jpegQuality = 0.45;

    function processImage(image){

        let width = image.width;
        let height = image.height;

        if(width > height && width > maxSize){

            height = Math.round(height * maxSize / width);
            width = maxSize;

        }else if(height > maxSize){

            width = Math.round(width * maxSize / height);
            height = maxSize;
        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext("2d", {
            alpha:false
        });

        /*
         * White background prevents black areas when converting
         * transparent images to JPEG.
         */
        context.fillStyle = "#FFFFFF";
        context.fillRect(0, 0, width, height);

        /*
         * Natural camera output—no horizontal flip.
         */
        context.drawImage(image, 0, 0, width, height);

        imageData = canvas.toDataURL(
            "image/jpeg",
            jpegQuality
        );

        document.getElementById("selfiePreview").src =
            imageData;

        document.getElementById(
            "selfiePreviewContainer"
        ).style.display = "block";

        document.getElementById("fileName").innerHTML =
            "✅ Selfie ready";

        document.getElementById("selfieLabel").innerHTML =
            "📷 CHANGE SELFIE";

        document.getElementById(
            "removeSelfie"
        ).style.display = "block";

        status.style.color = "#28A745";
        status.innerHTML =
            "✅ Selfie ready to submit.";

        setTimeout(function(){

            if(
                status.innerHTML ===
                "✅ Selfie ready to submit."
            ){
                status.innerHTML = "";
            }

        }, 1200);
    }

    /*
     * createImageBitmap is usually faster and handles phone image
     * orientation correctly. FileReader is the fallback.
     */
    if("createImageBitmap" in window){

        createImageBitmap(file, {
            imageOrientation:"from-image"
        })
        .then(function(bitmap){

            processImage(bitmap);
            bitmap.close();

        })
        .catch(function(){

            loadWithFileReader(file);
        });

    }else{

        loadWithFileReader(file);
    }

    function loadWithFileReader(selectedFile){

        const reader = new FileReader();

        reader.onload = function(e){

            const image = new Image();

            image.onload = function(){
                processImage(image);
            };

            image.onerror = function(){

                status.style.color = "#E53935";
                status.innerHTML =
                    "❌ Unable to read the selected image.";

                event.target.value = "";
            };

            image.src = e.target.result;
        };

        reader.onerror = function(){

            status.style.color = "#E53935";
            status.innerHTML =
                "❌ Unable to load the selfie.";

            event.target.value = "";
        };

        reader.readAsDataURL(selectedFile);
    }
}

function removeSelfie(){

    imageData = "";

    document.getElementById("selfie").value = "";

    document.getElementById("fileName").innerHTML =
        "No selfie selected";

    document.getElementById("selfieLabel").innerHTML =
        "📸 SELECT SELFIE";

    document.getElementById("removeSelfie").style.display =
        "none";

    document.getElementById("selfiePreview").removeAttribute("src");

    document.getElementById(
        "selfiePreviewContainer"
    ).style.display = "none";

}

function setLoading(isLoading, message, showOverlay){

    const overlay =
        document.getElementById("loadingOverlay");

    const loadingText =
        document.getElementById("loadingText");

    const submitBtn =
        document.getElementById("submitBtn");

    const nameSelect =
        document.getElementById("name");

    const attendanceSelect =
        document.getElementById("attendance");

    const selfieInput =
        document.getElementById("selfie");

    isSubmitting = isLoading;

    if(typeof showOverlay === "undefined"){
        showOverlay = true;
    }

    if(message){
        loadingText.innerHTML = message;
    }

    /*
     * Show the full popup only for TIME IN and TIME OUT.
     * Lunch actions still disable the form, but no popup appears.
     */
    overlay.style.display =
        (isLoading && showOverlay)
            ? "flex"
            : "none";

    submitBtn.disabled = isLoading;
    nameSelect.disabled = isLoading;
    attendanceSelect.disabled = isLoading;
    selfieInput.disabled = isLoading;

    submitBtn.innerHTML =
        isLoading
            ? "⏳ PROCESSING..."
            : "SUBMIT ATTENDANCE";
}

function showStatus(message, color, duration){

    const status =
        document.getElementById("status");

    status.style.color = color;
    status.innerHTML = message;

    if(duration){

        setTimeout(function(){
            status.innerHTML = "";
        }, duration);

    }

}

function getFastLocation(onSuccess, onError){

    const now = Date.now();

    /*
     * Reuse a recent location for up to 30 seconds.
     * This avoids waiting for GPS again when the employee retries.
     */
    if(
        cachedPosition &&
        (now - cachedPositionTime) <= 60000
    ){
        onSuccess(cachedPosition);
        return;
    }

    getFastLocation(

        function(position){

            cachedPosition = position;
            cachedPositionTime = Date.now();

            onSuccess(position);
        },

        onError,

        {
            enableHighAccuracy:true,
            timeout:7000,
            maximumAge:60000
        }
    );
}

function submitData(){

    if(isSubmitting){
        return;
    }

    const name =
        document.getElementById("name").value;

    const attendance =
        document.getElementById("attendance").value;

    if(name === ""){

        showStatus(
            "❌ Please select your name.",
            "#E53935",
            4000
        );

        return;

    }

    if(attendance === ""){

        showStatus(
            "❌ Please select attendance type.",
            "#E53935",
            4000
        );

        return;

    }

    if(
        (attendance === "TIME IN" ||
         attendance === "TIME OUT") &&
        imageData === ""
    ){

        showStatus(
            "❌ Please take your selfie first.",
            "#E53935",
            4000
        );

        return;

    }

    if(!navigator.geolocation){

        showStatus(
            "❌ GPS is not supported by your browser.",
            "#E53935",
            4000
        );

        return;

    }

    const requiresSelfie =
        attendance === "TIME IN" ||
        attendance === "TIME OUT";

    if(requiresSelfie){

        setLoading(
            true,
            "📍 Getting GPS location...",
            true
        );

    }else{

        setLoading(
            true,
            "",
            false
        );

        showStatus(
            "💾 Saving attendance...",
            "#444"
        );
    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            if(requiresSelfie){

                document.getElementById(
                    "loadingText"
                ).innerHTML =
                    "📤 Uploading selfie and saving attendance...";

            }else{

                showStatus(
                    "💾 Saving attendance...",
                    "#444"
                );
            }

            const formData =
                new URLSearchParams();

            formData.append("name", name);
            formData.append("attendance", attendance);
            formData.append("imageData", imageData);
            formData.append("latitude", latitude);
            formData.append("longitude", longitude);

            fetch(SCRIPT_URL, {
                method:"POST",
                body:formData,
                redirect:"follow"
            })

            .then(function(response){

                if(!response.ok){

                    throw new Error(
                        "Server error " +
                        response.status
                    );

                }

                return response.text();

            })

            .then(function(response){

                setLoading(false);

                if(response.indexOf("❌") > -1){

                    showStatus(
                        response,
                        "#E53935",
                        6000
                    );

                    return;
                }

                switch(attendance){

                    case "TIME IN":
                        showStatus(
                            "🟢 Time In recorded successfully.",
                            "#28A745",
                            4000
                        );
                        break;

                    case "TIME OUT":
                        showStatus(
                            "🔵 Time Out recorded successfully.",
                            "#1976D2",
                            4000
                        );
                        break;

                    case "LUNCH OUT":
                        showStatus(
                            "🍽️ Lunch Out recorded successfully. Enjoy your meal!",
                            "#FF9800",
                            4000
                        );
                        break;

                    case "LUNCH IN":
                        showStatus(
                            "🍴 Lunch In recorded successfully. Welcome back!",
                            "#4CAF50",
                            4000
                        );
                        break;
                }

                setTimeout(function(){

                    removeSelfie();

                    applySuccessfulAction(
                        attendance
                    );

                }, 900);

            })

            .catch(function(error){

                setLoading(false);

                showStatus(
                    "❌ Unable to connect to attendance server. " +
                    error.message,
                    "#E53935",
                    6000
                );

            });

        },

        function(error){

            setLoading(false);

            let message =
                "❌ Please allow GPS location.";

            if(error && error.code === 3){

                message =
                    "❌ GPS request timed out. Turn on location and try again.";

            }

            showStatus(
                message,
                "#E53935",
                5000
            );

        }

    );

}

function updateClock(){

    const now = new Date();

    document.getElementById("currentDate").innerHTML =
        now.toLocaleDateString("en-US", {
            month:"long",
            day:"numeric",
            year:"numeric"
        });

    document.getElementById("currentTime").innerHTML =
        now.toLocaleTimeString("en-US");

}

setInterval(updateClock, 1000);
updateClock();

</script>
